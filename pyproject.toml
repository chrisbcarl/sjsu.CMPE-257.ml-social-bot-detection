[project]
name = "sjsu-cmpe-257-ml-social-bot-detection"
version = "0.1.0"
description = "CPU simulator for SJSU 2026F CMPE 220 System Software instructed by Ishie Eswar."
authors = [
    {name = "Chris Carl",email = "chris.carl@sjsu.edu"},
    {name = "Chris Carl",email = "jehu.zepeda-silva@sjsu.edu"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=3.1.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "ipympl (>=0.10.0,<0.11.0)",
    "ipywidgets (>=8.1.9,<9.0.0)",
    "botometer (>=2.0.1,<3.0.0)",
    "imbalanced-learn (>=0.14.2,<0.15.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
